<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="./static/signup.css">
    <link rel="shortcut icon" href="./favicon.svg" type="image/x-icon">
    <script src="./scripts/Auth0.js" defer></script>

</head>
<body>
    <div class="signup-form">
        <form action="">
            <div class="form-title">
                <h1>Sign up</h1>
            </div>
            
            <div class="input-field">
                <label for="username">Username</label>
                <div class="input-and-logo">
                    <img src="./icons/user icon.png" class="input-icon" alt="user icon">
                    <input type="text" name="username" id="username" placeholder="Type your username" autocomplete="username" required>
                </div>

                <hr class="hr">
            </div>
            <p id="username-error"></p>
            
            <div class="input-field">
                <label for="email">E-mail</label>
                <div class="input-and-logo">
                    <img src="./icons/email2.png" class="input-icon" alt="mail icon">
                    <input type="email" name="email" id="email" placeholder="Type your email adress" autocomplete="username" required>
                </div>

                <hr class="hr">
            </div>
            <p id="email-error"></p>

            <div class="input-field">
                <label for="password">Password</label>
                <div class="input-and-logo">
                    <img src="./icons/lock icon.png" class="input-icon" alt="lock icon">
                    <input type="password" name="password" id="password" placeholder="Type your password" autocomplete="current-password" required>
                    <img src="./icons/hide-password.png" id="show-or-hide-password" alt="eye icon">
                </div>

                <hr class="hr">
            </div>
            <p id="password-error"></p>

            <button id="signup-btn">Sign Up</button>

            <p>Or Sign Up Using</p>
            <div class="sign-up">
                <div class="signup-option">
                    <a href="#"><img class="socail-media-icons" src="./icons/facebook.webp" alt="facebook logo"></a>
                    <a href="#"><img class="socail-media-icons" src="./icons/linkedin.png" alt="linkedin logo"></a>
                    <a href="#"><img class="socail-media-icons" src="./icons/google.png" alt="google logo"></a>
                </div>
            </div>

            <p>Or Already have and account</p>
            <a href="./login.html" class="external-link">Login</a>

        </form>

    </div>
</body>
</html>
